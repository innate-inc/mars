services:
  cloud-agent:
    container_name: mars-cloud-agent
    build:
      context: ${MARS_CLOUD_AGENT_SOURCE_DIR}
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ${MARS_CLOUD_AGENT_SOURCE_DIR}:/app
    env_file:
      - ${MARS_CLOUD_AGENT_ENV_FILE}
    command: python -u run_server.py
    ports:
      - "${MARS_CLOUD_AGENT_PORT:-8765}:8765"
    restart: unless-stopped
